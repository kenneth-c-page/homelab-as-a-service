# Example Secret for Lucas's services.
#
# Do not apply this file as-is. Copy it to k3s/secrets.local.yml (ignored by
# Git), replace the placeholder values, then apply the local copy:
#
#   cp k3s/secrets.example.yml k3s/secrets.local.yml
#   # edit k3s/secrets.local.yml
#   kubectl apply -f k3s/secrets.local.yml
#
# See k3s/lucas-secrets.md for generating the values.
---
apiVersion: v1
kind: Secret
metadata:
  name: homelab-secrets
  namespace: 344-group-project
  labels:
    app.kubernetes.io/part-of: homelab-as-a-service
type: Opaque
stringData:
  # Replace these before applying the local copy.
  PG_PASS: "CHANGE_ME_postgres_password"
  AUTHENTIK_SECRET_KEY: "CHANGE_ME_authentik_secret_key_at_least_50_characters_long_0000000000"
  PIHOLE_PASSWORD: "CHANGE_ME_pihole_admin_password"
