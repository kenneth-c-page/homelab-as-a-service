---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: 344-group-project
  labels:
    app: vaultwarden-pod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vaultwarden-pod
  template:
    metadata:
      labels:
        app: vaultwarden-pod
    spec:
      volumes:
      - name: vaultwarden-pv-storage
        persistentVolumeClaim:
          claimName: vaultwarden-pv-claim
      containers:
      - name: vaultwarden-container
        image: vaultwarden/server:latest
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
        ports:
        - containerPort: 80
        securityContext:
          privileged: false
        env:
          - name: ADMIN_TOKEN
            valueFrom:
              secretKeyRef:
                name: vaultwarden-admin
                key: admin-token
        livenessProbe:
          httpGet:
            path: /alive
            port: 80
            scheme: HTTP
          initialDelaySeconds: 60
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-lb
  namespace: 344-group-project
spec:
  selector:
    app: vaultwarden-pod
  ports:
    - port: 8000
      targetPort: 80
  type: LoadBalancer