--- # Longhorn configuration for redundant disks; if using this as a reference, DO NOT USE vw-data and vw-storage.
# Instead, look at sequence.md for steps and resources on how to do this
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: vw-longhorn
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  fsType: "ext4"
  diskSelector: "vw-data"
  nodeSelector: "vw-storage"
  replicaSoftAntiAffinity: "disabled"
--- # PVC using the Longhorn StorageClass
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vw-data-longhorn-pvc
  namespace: 344-group-project
spec:
  accessModes:
    - ReadWriteOncePod
  volumeMode: Filesystem
  storageClassName: vw-longhorn
  resources:
    requests:
      storage: 10Gi
--- # VaultWarden app config
# The vw-secret Secret (ADMIN_TOKEN, SIGNUPS_ALLOWED, DOMAIN) is created by
# ansible/playbooks/run-deployments.yml from the Ansible vault, so the token
# never lives in this repo in plaintext.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vw-app
  namespace: 344-group-project
  labels:
    app: vw-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vw-app
  template:
    metadata:
      labels:
        app: vw-app
    spec:
      containers:
        - name: vw-pod
          image: vaultwarden/server@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
          ports:
          - containerPort: 80
            name: http
          env:
          - name: ADMIN_TOKEN
            valueFrom:
              secretKeyRef:
                name: vw-secret
                key: ADMIN_TOKEN
          - name: SIGNUPS_ALLOWED
            valueFrom:
              secretKeyRef:
                name: vw-secret
                key: SIGNUPS_ALLOWED
          - name: DOMAIN
            valueFrom:
              secretKeyRef:
                name: vw-secret
                key: DOMAIN
          - name: ROCKET_PORT
            value: "80"
          - name: DATA_FOLDER
            value: "/data"
          volumeMounts:
          - name: data
            mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /alive
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vw-data-longhorn-pvc
--- # Ingress to advertise the vaultwarden service via traefik under the ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: vw-traefik-ingress
  namespace: 344-group-project
spec:
  selector:
    app: vw-app
  ports:
    - port: 8000
      targetPort: 80
      protocol: TCP
      name: http
  type: ClusterIP
--- # Ingress that routes to the traefik ingress service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vw-tls-ingress
  namespace: 344-group-project
  annotations:
    cert-manager.io/cluster-issuer: cm-ca
spec:
  tls:
  - hosts:
      - vaultwarden.home.arpa
    secretName: vw-tls-secret
  rules:
  - host: vaultwarden.home.arpa
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vw-traefik-ingress 
            port:
              number: 8000
